[package]
name = "field-sdk"
version = "0.1.0"
description = "Rust client for the TACHYON Field REST API"
repository = "https://github.com/quantum-box/field-sdk"
license = "MIT"
edition = "2021"
publish = false

# The sources under src/ are generated by openapi-generator from
# ../openapi.yaml, but this manifest is hand-maintained: it is listed in
# .openapi-generator-ignore so metadata survives regeneration. Update the
# dependency set here when the generator's template changes.

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart", "stream"] }

# The spec now carries file-upload endpoints (golf course tabular analysis, the
# bridge import/export pair), and the generator's multipart template streams the
# file rather than reading it into memory: it opens a `tokio::fs::File`, wraps it
# in a `tokio_util::codec::FramedRead`, and hands that to
# `reqwest::Body::wrap_stream` — hence `stream` on reqwest above. Without these
# three the generated `src/apis/*.rs` does not compile.
tokio = { version = "^1", features = ["fs"] }
tokio-util = { version = "^0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls"]
