info:
  description: ''
  license:
    name: ''
  title: tachyon-field-api
  version: 0.1.7
openapi: 3.1.0
paths:
  /api/agent/invoices:
    get:
      operationId: agent_list_invoices
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
          description: ''
      tags:
      - Agent Documents
    post:
      operationId: agent_create_invoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/invoices/{id}:
    get:
      operationId: agent_get_invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/invoices/{id}/send:
    post:
      operationId: agent_send_invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/quotations:
    get:
      operationId: agent_list_quotations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
          description: ''
      tags:
      - Agent Documents
    post:
      operationId: agent_create_quotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/quotations/{id}:
    get:
      operationId: agent_get_quotation
      parameters:
      - description: Quotation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/quotations/{id}/send:
    post:
      operationId: agent_send_quotation
      parameters:
      - description: Quotation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
          description: ''
      tags:
      - Agent Documents
  /api/approvals:
    get:
      operationId: list_approvals
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resourceType
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resourceId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflowListResponse'
          description: ''
      tags:
      - Approvals
    post:
      operationId: mutate_approval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalMutationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflowResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflowResponse'
          description: ''
      tags:
      - Approvals
  /health:
    get:
      operationId: health_check
      responses:
        '200':
          description: OK
      summary: Lightweight liveness probe — always returns 200.
      tags: []
  /health/ready:
    get:
      description: Returns 200 when all dependencies are healthy, 503 otherwise.
      operationId: readiness_check
      responses:
        '200':
          description: All dependencies healthy
        '503':
          description: One or more dependencies unhealthy
      summary: Readiness probe — verifies database connectivity.
      tags: []
  /v1/bridge/actions/{action}:
    post:
      operationId: invoke_bridge_action
      parameters:
      - description: Bridge action name
        in: path
        name: action
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeActionResponse'
          description: Bridge action availability
      tags:
      - TACHYON Field Bridge
  /v1/bridge/definitions:
    get:
      operationId: list_bridge_definitions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDefinitionListResponse'
          description: Bridge definition list
      tags:
      - TACHYON Field Bridge
    post:
      operationId: create_bridge_definition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeDefinitionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDefinitionResponse'
          description: Bridge definition created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
      tags:
      - TACHYON Field Bridge
