  /v1/public/storefront/{tenant_id}/orders/lookup:
    post:
      description: |-
        #1148 kept order reads off this surface because a caller-held identifier
        is not evidence of identity, and an order id alone still is not. This
        route does not take one: it takes the two things a customer has and a
        passer-by does not, and it is metered on the tightest budget here so the
        pair cannot be walked. A wrong pair and an unknown phone number are the
        same 404, so a failed attempt does not confirm the number exists.

        The response carries no more than the confirmation screen already showed
        at checkout — no address, no email, no customer record.
