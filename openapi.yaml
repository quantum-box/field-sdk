        createdAt:
          type: string
        defaultTaxCategory:
          type: string
        id:
          type: string
        name:
          type: string
        notes:
          type:
          - string
          - 'null'
        paymentTerms:
          type:
          - string
          - 'null'
        qualifiedInvoiceIssuerNumber:
          type:
          - string
          - 'null'
        status:
          type: string
        taxRegistrationName:
          type:
          - string
          - 'null'
        tenantId:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - name
      - defaultTaxCategory
      - status
      - createdAt
      - updatedAt
      type: object
    VoidInvoiceRequest:
      properties:
        reason:
          type: string
      required:
      - reason
      type: object
    VoidInvoiceResponse:
      properties:
        correctionId:
          type: string
        invoice:
          $ref: '#/components/schemas/InvoiceResponse'
        replayed:
          type: boolean
        reversalOn:
          type:
          - string
          - 'null'
        reversedJournalCount:
          minimum: 0
          type: integer
      required:
      - correctionId
      - invoice
      - reversalOn
      - reversedJournalCount
      - replayed
      type: object
    WarehouseListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WarehouseResponse'
          type: array
      required:
      - items
      type: object
    WarehouseResponse:
      properties:
        createdAt:
          type: string
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - kind
      - name
      - createdAt
      - updatedAt
      type: object
    WebhookDeliveryResponse:
      properties:
        attempt_count:
          format: int32
          minimum: 0
          type: integer
        created_at:
          type: string
        dead_at:
          type:
          - string
          - 'null'
        event_id:
          type: string
        event_type:
          type: string
        id:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        last_status_code:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        next_attempt_at:
          type: string
        status:
          description: '`pending`, `in_flight`, `succeeded`, or `dead`.'
          type: string
        succeeded_at:
          type:
          - string
          - 'null'
      required:
      - id
      - event_id
      - event_type
      - status
      - attempt_count
      - next_attempt_at
      - created_at
      type: object
    WebhookEndpointResponse:
      properties:
        blocked_at:
          type:
          - string
          - 'null'
        consecutive_failures:
          description: 連続して恒久失敗した配信の数。`blocked` の理由を読むための値。
          format: int32
          minimum: 0
          type: integer
        description:
          type:
          - string
          - 'null'
        event_types:
          description: 購読している versioned event type。
          items:
            type: string
          type: array
        id:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        previous_secret_expires_at:
          description: 旧世代の署名を併記しなくなる時刻。
          type:
          - string
          - 'null'
        previous_secret_version:
          description: ローテーション猶予中だけ入る。この世代の署名もまだ併記されている。
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        secret_version:
          description: 導出シークレットの世代。値そのものは返さない。
          format: int32
          minimum: 0
          type: integer
        status:
          description: '`active`, `paused`, or `blocked`.'
          type: string
        url:
          type: string
      required:
      - id
      - url
      - event_types
      - status
      - secret_version
      - consecutive_failures
      type: object
    WebhookEndpointWithSecretResponse:
      allOf:
      - $ref: '#/components/schemas/WebhookEndpointResponse'
      - properties:
          signing_secret:
            description: 一度だけ返る。サーバは平文を保存しないので、後から読み出せない。
            type: string
        required:
        - signing_secret
        type: object
      description: 作成とローテーションの応答**だけ**がシークレットを載せる。
    WebhookTestResponse:
      description: 疎通確認の結果。応答本文は返さない（secret や PII が混ざりうる）。
      properties:
        delivered:
          type: boolean
        error_code:
          description: 有界な失敗理由。`TIMEOUT` / `BLOCKED_ADDRESS` / `CLIENT_ERROR` など。
          type:
          - string
          - 'null'
        status_code:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - delivered
      type: object
    crate.order_api.OrderItemResponse:
      properties:
        amount:
          format: int64
          type: integer
        description:
          type: string
        quantity:
          format: int64
          type: integer
        sku:
          type:
          - string
          - 'null'
        unitPrice:
          format: int64
          type: integer
      required:
      - description
      - quantity
      - unitPrice
      - amount
      type: object
    crate.order_api.OrderResponse:
      properties:
        cancelledAt:
          type:
          - string
          - 'null'
        clientEmail:
          type:
          - string
          - 'null'
        clientId:
          type: string
        clientName:
          type:
          - string
          - 'null'
        completedAt:
          type:
          - string
          - 'null'
        confirmedAt:
          type:
          - string
          - 'null'
        convertedInvoiceId:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        currency:
          type: string
        id:
          type: string
        inventoryDecrementedAt:
          type:
          - string
          - 'null'
        items:
          items:
            $ref: '#/components/schemas/crate.order_api.OrderItemResponse'
          type: array
        notes:
          type:
          - string
          - 'null'
        orderNumber:
          type: string
        shippedAt:
          type:
          - string
          - 'null'
        source:
          type: string
        squareOrderId:
          type:
          - string
          - 'null'
        squarePaymentId:
          type:
          - string
          - 'null'
        status:
          type: string
        subtotalAmount:
          format: int64
          type: integer
        taxAmount:
          format: int64
          type: integer
        tenantId:
          type: string
        totalAmount:
          format: int64
          type: integer
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - orderNumber
      - clientId
      - items
      - status
      - source
      - currency
      - subtotalAmount
      - taxAmount
      - totalAmount
      - createdAt
      - updatedAt
      type: object
  securitySchemes:
    bearerAuth:
      description: TACHYON Field access token
      scheme: bearer
      type: http
    cognitoBearer:
      bearerFormat: JWT
      description: Cognito user access token
      scheme: bearer
      type: http
    signingCapability:
      description: Use the custom `Signing` authorization scheme. The opaque capability must not be logged or persisted by clients.
      in: header
      name: Authorization
      type: apiKey
info:
  description: ''
  license:
    name: ''
  title: tachyon-field-api
  version: 0.1.25
openapi: 3.1.0
paths:
  /api/agent/invoices:
    get:
      operationId: agent_list_invoices
      parameters:
      - description: Filter by invoice status.
        in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Filter by client ID.
        in: query
        name: client_id
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Return invoices raised from this record kind. One of `reservation`,
          `order`, `subscription`, `quotation`, `contract`.

          Named in camelCase to match the JSON bodies, with the endpoint's older
          snake_case spelling accepted as an alias so both conventions work.
        in: query
        name: sourceType
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Return invoices raised from this record. Combine with `sourceType` to
          answer whether a given record has already been billed.
        in: query
        name: sourceId
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Return invoices carrying this caller-defined classification on any of
          their sources. Matched exactly.
        in: query
        name: reason
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Maximum number of invoices to return.
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - description: Number of invoices to skip.
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
          description: ''
      tags:
      - Agent Documents
    post:
      operationId: agent_create_invoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/invoices/{id}:
    get:
      operationId: agent_get_invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/invoices/{id}/send:
    post:
      operationId: agent_send_invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/quotations:
    get:
      operationId: agent_list_quotations
      parameters:
      - description: Filter by quotation status.
        in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Filter by client ID.
        in: query
        name: client_id
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Maximum number of quotations to return.
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - description: Number of quotations to skip.
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
          description: ''
      tags:
      - Agent Documents
    post:
      operationId: agent_create_quotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/quotations/{id}:
    get:
      operationId: agent_get_quotation
      parameters:
      - description: Quotation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
          description: ''
      tags:
      - Agent Documents
  /api/agent/quotations/{id}/send:
    post:
      operationId: agent_send_quotation
      parameters:
      - description: Quotation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
          description: ''
      tags:
      - Agent Documents
  /api/approvals:
    get:
      operationId: list_approvals
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resourceType
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resourceId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflowListResponse'
          description: ''
      tags:
      - Approvals
    post:
      operationId: mutate_approval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalMutationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflowResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflowResponse'
          description: ''
      tags:
      - Approvals
  /health:
    get:
      operationId: health_check
      responses:
        '200':
          description: OK
      summary: Lightweight liveness probe — always returns 200.
      tags: []
  /health/ready:
    get:
      description: Returns 200 when all dependencies are healthy, 503 otherwise.
      operationId: readiness_check
      responses:
        '200':
          description: All dependencies healthy
        '503':
          description: One or more dependencies unhealthy
      summary: Readiness probe — verifies database connectivity.
      tags: []
  /v1/bridge/actions/{action}:
    post:
      operationId: invoke_bridge_action
      parameters:
      - description: Bridge action name
        in: path
        name: action
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeActionResponse'
          description: Bridge action availability
      tags:
      - TACHYON Field Bridge
  /v1/bridge/definitions:
    get:
      operationId: list_bridge_definitions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDefinitionListResponse'
          description: Bridge definition list
      tags:
      - TACHYON Field Bridge
    post:
      operationId: create_bridge_definition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeDefinitionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDefinitionResponse'
          description: Bridge definition created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
      tags:
      - TACHYON Field Bridge
  /v1/bridge/definitions/{definition_id}/runs/preview:
    post:
      operationId: preview_bridge_run
      parameters:
      - description: Bridge definition ID
        in: path
        name: definition_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeRunPreviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunResponse'
          description: Existing idempotent Bridge run preview
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunResponse'
          description: Bridge run preview created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
      tags:
      - TACHYON Field Bridge
  /v1/bridge/definitions/{definition_id}/runs/preview-file:
    post:
      operationId: preview_bridge_file
      parameters:
      - description: Bridge definition ID
        in: path
        name: definition_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TabularUploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunResponse'
          description: Existing idempotent Bridge preview
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunResponse'
          description: Bridge file preview created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid file or definition
      tags:
      - TACHYON Field Bridge
  /v1/bridge/exports/definitions:
    get:
      operationId: list_bridge_export_definitions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeExportDefinitionListResponse'
          description: Bridge export definition list
      tags:
      - TACHYON Field Bridge Export
    post:
      operationId: create_bridge_export_definition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeExportDefinitionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeExportDefinitionResponse'
          description: Bridge export definition created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
      tags:
      - TACHYON Field Bridge Export
  /v1/bridge/exports/definitions/{definition_id}/csv:
    get:
      operationId: export_bridge_csv
      parameters:
      - description: Bridge export definition ID
        in: path
        name: definition_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/csv: {}
          description: Rendered CSV for the export definition
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
      tags:
      - TACHYON Field Bridge Export
  /v1/bridge/exports/objects:
    get:
      operationId: list_bridge_export_objects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeExportObjectListResponse'
          description: Exportable bridge source objects and their fields
      tags:
      - TACHYON Field Bridge Export
  /v1/bridge/objects:
    get:
      description: |-
        The browser builds its mapping UI from this instead of keeping a second copy
        of the field lists: a target added to the registry shows up in the UI with
        no client change, and the two can no longer disagree about what is required.
      operationId: list_bridge_target_objects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeTargetObjectListResponse'
          description: Importable bridge target objects and their fields
      summary: The objects a definition may target, with the properties each one accepts.
      tags:
      - TACHYON Field Bridge
  /v1/bridge/runs:
    get:
      operationId: list_bridge_runs
      parameters:
      - description: Page size (1-100)
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - description: Zero-based history offset
        in: query
        name: offset
        required: false
        schema:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunListResponse'
          description: Tenant-scoped Bridge run history
      tags:
      - TACHYON Field Bridge
  /v1/bridge/runs/{run_id}:
    get:
      operationId: get_bridge_run
      parameters:
      - description: Bridge run ID
        in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunResponse'
          description: Bridge run detail
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
      tags:
      - TACHYON Field Bridge
  /v1/bridge/runs/{run_id}/execute:
    post:
      operationId: execute_bridge_run
      parameters:
      - description: Bridge run ID
        in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeRunResponse'
          description: Bridge run executed and draft targets created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Execution lease conflict
      tags:
      - TACHYON Field Bridge
  /v1/bridge/tabular/analyze:
    post:
      operationId: analyze_bridge_tabular
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TabularUploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabularAnalyzeResponse'
          description: Parsed table and mapping candidates
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid file or mapping request
      tags:
      - TACHYON Field Bridge
  /v1/erp/analytics/customer-purchase-summary:
    get:
      description: |-
        1回の数え方・キャンセル/no-show の扱い・金額未確定・税込は単票と同じ。
        金額で並べ替えるため1ページは単一通貨で、`currency` を省略したときに対象へ
        通貨が2つ以上あれば 400 にして選ばせる（黙って合算すると呼び出し側が
        気づけないまま間違った合計を使う）。

        `total` は絞り込み後の顧客数で、`limit` / `offset` とは独立している。
        既定では購入が1件も無い顧客は出ない（`minPurchaseCount` の既定が 1）。
      operationId: list_customer_purchase_summaries
      parameters:
      - description: 提供日（Asia/Tokyo）の下限。`YYYY-MM-DD`。
        in: query
        name: from
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: 提供日（Asia/Tokyo）の上限。`YYYY-MM-DD`。
        in: query
        name: to
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          集計する通貨。対象に通貨が1つしか無ければ省略できる。2つ以上あるのに
          省略すると、どれで並べたいのか決まらないので 400。
        in: query
        name: currency
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          期間内の購入回数の下限。既定 1（購入が1件も無い顧客は出ない）。
          0 を渡すと、キャンセルや no-show しかない顧客も出る。
        in: query
        name: minPurchaseCount
        required: false
        schema:
          format: int64
          type:
          - integer
          - 'null'
      - description: 最終購入からこの日数以上あいた顧客だけを返す（休眠の抽出）。
        in: query
        name: dormantForDays
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - description: |-
          `total_amount` / `purchase_count` / `last_purchase_date`。既定は
          `total_amount`。
        in: query
        name: sort
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: '`asc` / `desc`。既定は `desc`。'
        in: query
        name: order
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: 既定 50、上限 200。
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPurchaseSummaryListResponse'
          description: 購買サマリの一覧
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: クエリが不正、または通貨が一意に決まらない
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: field:ViewSalesAnalytics がない
      summary: 顧客ごとの購買サマリを横断で返す。
      tags:
      - TACHYON field - Analytics
  /v1/erp/analytics/customer-purchase-summary/{customer_id}:
    get:
      description: |-
        1回 = 予約1件。`confirmed` / `completed` で、かつ提供開始 (`startsAt`) が
        `computedAt` を過ぎたものだけを購入として数える。キャンセル・no-show・
        未提供・未確定は金額にも回数にも入れず、それぞれ件数だけを別項目で返す。
        金額は税込で、`reservations.currency` ごとに `currencies` へ分けて返す。
        集計はリクエストごとの都度計算で、いつ時点かは `computedAt`。

        顧客台帳の存在確認はしない。予約を1件も持たない ID でも 404 ではなく、
        すべて 0 のサマリを返す（「購入が無い」は正当な答えなので）。
      operationId: get_customer_purchase_summary
      parameters:
      - description: 顧客台帳の ID（reservations.customer_id）
        in: path
        name: customer_id
        required: true
        schema:
          type: string
      - description: 提供日（Asia/Tokyo）の下限。`YYYY-MM-DD`。省略すると全期間。
        in: query
        name: from
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: 提供日（Asia/Tokyo）の上限。`YYYY-MM-DD`。省略すると全期間。
        in: query
        name: to
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPurchaseSummaryResponse'
          description: 購買サマリ
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: クエリが不正
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: field:ViewSalesAnalytics がない
      summary: 顧客1件の購買サマリ。
      tags:
      - TACHYON field - Analytics
