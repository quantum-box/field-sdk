  /v1/erp/handoff-notes:
    get:
      description: |-
        Lists handover notes, newest first.

        Pass `subjectType` and `subjectId` for one subject's board, or `outstandingOnly=true` for everything still waiting to be picked up. Retracted notes are hidden unless `includeRetracted=true`.
      operationId: list_handoff_notes
      parameters:
      - description: |-
          Narrow to one subject, e.g. `reservation`. Both parts are needed for a
          single subject's board; either alone still filters.
        in: query
        name: subjectType
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: subjectId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: category
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Keep only notes nobody has taken over yet — the shift-start read.
        in: query
        name: outstandingOnly
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - description: |-
          Include notes that were withdrawn. Off by default so a retracted note
          stops appearing on the board, while staying readable for audit.
        in: query
        name: includeRetracted
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - in: query
        name: from
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - in: query
        name: to
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffNoteListResponse'
          description: ''
      tags:
      - Reservations
    post:
      description: |-
        Appends one handover note.

        The note is never edited afterwards. A mistaken note is retracted, not rewritten, so the board always shows what was actually written.
      operationId: create_handoff_note
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHandoffNoteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffNote'
          description: ''
      tags:
      - Reservations
  /v1/erp/handoff-notes/{id}/acknowledge:
    post:
      description: |-
        Marks the note as taken over.

        The first acknowledgement wins: pressing this on an already acknowledged note keeps whoever picked it up first, because that is the fact the handover turns on.
      operationId: acknowledge_handoff_note
      parameters:
      - description: Handoff note ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffNote'
          description: ''
      tags:
      - Reservations
  /v1/erp/handoff-notes/{id}/retract:
    post:
      description: |-
        Withdraws a note written in error.

        The row is not deleted and the body is not rewritten: the note stays readable and marked as retracted, which is what keeps the log a log.
      operationId: retract_handoff_note
      parameters:
      - description: Handoff note ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetractHandoffNoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffNote'
          description: ''
      tags:
      - Reservations
