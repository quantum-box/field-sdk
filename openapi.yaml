      summary: |-
        キャディ自動配置（T09）。
        対象日のキャディ付き予約のうち未割当のものへ、以下を考慮して割り当てる:
        - 稼働可否（希望休・午前/午後のみ・軽勤務）
        - 1日の担当数（2ラウンドは can_two_rounds かつ two_round_request のときのみ）
        - 月間契約ラウンドの残数が多い順（生活基盤=契約消化を優先）
        - 同点はレーティング順
      tags:
      - Golf Course
