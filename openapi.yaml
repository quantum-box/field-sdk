    ReservationWaitlistCandidate:
      allOf:
      - $ref: '#/components/schemas/ReservationWaitlistEntry'
      - properties:
          availableSlotGroups:
            description: |-
              Free groups left on the slot right now, or `None` when no slot row
              exists for the requested time — an unopened slot is not the same answer
              as a full one, and only the second is something an operator can wait
              out.

              Groups, not people: `reservation_time_slots.capacity` counts inventory
              groups and one reservation consumes exactly one of them whatever its
              party size (`slot_consumption::hold_one_group`). A party of four
              therefore needs one free group, not four.
            format: int32
            type:
            - integer
            - 'null'
          queuePosition:
            description: |-
              1-based place in the queue for this entry's slot, counting only entries
              still waiting.
            format: int32
            minimum: 0
            type: integer
        required:
        - queuePosition
        type: object
      description: |-
        A queue entry together with what an operator needs to decide about it.

        The two extra fields are computed per read rather than stored: both go
        stale the moment any other reservation on the slot changes, so a stored
        copy would be wrong more often than right.
    ReservationWaitlistEntry:
      description: One request waiting for a slot.
      properties:
        closedAt:
          format: date-time
          type:
          - string
          - 'null'
        closedBy:
          type:
          - string
          - 'null'
        closedReason:
          type:
          - string
          - 'null'
        convertedReservationId:
          type:
          - string
          - 'null'
        createdAt:
          format: date-time
          type: string
        customerEmail:
          type:
          - string
          - 'null'
        customerId:
          type:
          - string
          - 'null'
        customerName:
          type:
          - string
          - 'null'
        customerPhone:
          type:
          - string
          - 'null'
        desiredEndsAt:
          format: date-time
          type: string
        desiredStartsAt:
          format: date-time
          type: string
        enqueuedAt:
          description: |-
            When the entry joined the queue. Distinct from `created_at` so that a
            re-queued request sorts by when it re-queued.
          format: date-time
          type: string
        id:
          type: string
        notes:
          type:
          - string
          - 'null'
        quantity:
          format: int32
          type: integer
        reservationTypeId:
          type: string
        resourceId:
          description: |-
            The resource the entry is waiting on. Stored as the empty string when
            unset, matching `reservation_time_slots`, but exposed as `None` so
            callers never have to know that.
          type:
          - string
          - 'null'
        serviceId:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ReservationWaitlistStatus'
        storeId:
          type:
          - string
          - 'null'
        tenantId:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - tenantId
      - reservationTypeId
      - desiredStartsAt
      - desiredEndsAt
      - quantity
      - status
      - enqueuedAt
      - createdAt
      - updatedAt
      type: object
    ReservationWaitlistListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReservationWaitlistCandidate'
          type: array
      required:
      - items
      type: object
    ReservationWaitlistStatus:
      description: |-
        Where an entry stands. Only `Waiting` is in the queue; the other three
        are terminal and differ in *why* the entry left it, which is what a
