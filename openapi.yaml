    get:
      operationId: storefront_list_resources
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
          description: ''
      tags:
      - StoreKit
  /v1/storekit/resources/{id}/availability-calendar:
    get:
      operationId: storefront_resource_availability_calendar
      parameters:
      - description: Reservation resource ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: First tenant-local calendar date, inclusive.
        in: query
        name: from
        required: true
        schema:
          format: date
          type: string
      - description: Last tenant-local calendar date, inclusive.
        in: query
        name: to
        required: true
        schema:
          format: date
          type: string
      - description: IANA timezone defining `from`/`to`. Omitted keeps Asia/Tokyo.
        in: query
        name: timezone
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Remaining groups at or below which a day reads as "few left".
        in: query
        name: fewLeftThreshold
        required: false
        schema:
          format: int32
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontAvailabilityCalendarResponse'
          description: ''
      security:
      - {}
      tags:
      - StoreKit
  /v1/storekit/resources/{id}/time-slots:
    get:
      operationId: storefront_list_resource_time_slots
      parameters:
      - description: Reservation resource ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Tenant-local calendar date to list bookable slots for.
        in: query
        name: date
        required: true
        schema:
          format: date
          type: string
      - description: IANA timezone defining `date`. Omitted keeps the legacy Asia/Tokyo day.
        in: query
        name: timezone
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Include slots with no remaining groups. Defaults to hiding them.
        in: query
        name: includeSoldOut
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontResourceTimeSlotListResponse'
          description: ''
      tags:
      - StoreKit
  /v1/storekit/storefront-profile:
    get:
      description: |-
        `/v1/storekit/*` is reachable without a bearer token because
        `erp_authz::erp_action_for_request` has no branch for it and falls through
        to `None`. The tenant comes from `x-operator-id`, exactly as it does for the
        other storefront reads the page already makes.

        This handler takes neither an `Executor` nor an `AuthApp`, so it structurally
        cannot perform a staff action — the same narrowing the public membership
        router expresses through a reduced use-case trait.
      operationId: storefront_get_storefront_profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProfileResponse'
          description: ''
      security:
      - {}
      summary: Anonymous read for the public storefront.
      tags:
      - StoreKit
  /v1/storekit/webhook-endpoints:
    get:
      operationId: list_webhook_endpoints
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WebhookEndpointResponse'
                type: array
          description: ''
      summary: テナントの webhook 宛先を一覧する。
      tags:
      - StoreKit
    post:
      operationId: create_webhook_endpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookEndpointRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecretResponse'
          description: ''
      summary: webhook 宛先を登録し、署名シークレットを一度だけ返す。
      tags:
      - StoreKit
  /v1/storekit/webhook-endpoints/{endpoint_id}:
    delete:
      operationId: delete_webhook_endpoint
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
      summary: webhook 宛先を削除する。
      tags:
      - StoreKit
    get:
      operationId: get_webhook_endpoint
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
          description: ''
      summary: webhook 宛先を1件取得する。
      tags:
      - StoreKit
    patch:
      operationId: update_webhook_endpoint
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookEndpointRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
          description: ''
      summary: webhook 宛先を部分更新する。
      tags:
      - StoreKit
  /v1/storekit/webhook-endpoints/{endpoint_id}/deliveries:
    get:
      operationId: list_webhook_deliveries
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          type: string
      - in: path
        name: limit
        required: true
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WebhookDeliveryResponse'
                type: array
          description: ''
      summary: 宛先の配送履歴を新しい順に返す。
      tags:
      - StoreKit
  /v1/storekit/webhook-endpoints/{endpoint_id}/rotate-secret:
    post:
      description: 旧世代は24時間だけ併記される。受信側はその間に値を差し替える。
      operationId: rotate_webhook_endpoint_secret
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecretResponse'
          description: ''
      summary: 署名シークレットを更新し、新しい値を一度だけ返す。
      tags:
      - StoreKit
  /v1/storekit/webhook-endpoints/{endpoint_id}/test:
    post:
      description: |-
        実配送とまったく同じ経路（SSRF ガード・接続先の固定・署名・timeout）を
        通る。注文イベントも配送行も作らないので、履歴には残らない。
      operationId: test_webhook_endpoint
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
          description: ''
      summary: 宛先へ署名付きの疎通確認イベントを1回送る。
      tags:
      - StoreKit
