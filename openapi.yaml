          description: No order in this tenant matches that phone number and those digits
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Tenant order lookup budget exhausted
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public storefront limiter unavailable
      security:
      - {}
      summary: Find one order from what its customer knows.
      tags:
      - Public storefront
