  /v1/public/storefront/{tenant_id}/carts/{cart_id}/coupon-preview:
    post:
      description: |-
        A discount has to be visible before it is submitted — a checkout screen
        that takes a code and reveals what it did only once the order exists is not
        one anybody will use. The oracle a bare `validate_coupon` would be is
        closed by what this route demands rather than by withholding the answer:
        the caller has to hold a cart identifier, which costs a `CartWrite` to
        mint, and the attempt is metered on its own budget on top of that. Every
        rejection is the same 404 whether the code does not exist, has expired, or
        does not clear the cart's minimum, so working through a code space learns
        nothing from the replies.

        Nothing is persisted. A preview neither reserves the code nor commits the
        cart to it; `checkout` re-validates and re-prices server-side, and that
        result is the one the order is built from.
      operationId: public_storefront_preview_coupon
      parameters:
      - description: Tenant whose public storefront is being ordered from
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
      - description: Cart the caller holds the identifier of
        in: path
        name: cart_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCouponPreviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCouponPreviewResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such cart in this tenant, or the code does not apply to it
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Tenant coupon attempt budget exhausted
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public storefront limiter unavailable
      security:
      - {}
      summary: Price one code against one cart.
      tags:
      - Public storefront
