          description: Validation failed. The response code is SIGNING_VALUES_INVALID or SIGNATURE_UNRENDERABLE.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid signing capability
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Signing session state or idempotency conflict
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSigningErrorResponse'
          description: Signing session expired or revoked
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSigningErrorResponse'
          description: Signing service is temporarily unavailable
      security:
      - signingCapability: []
      tags:
      - Public Sales Contract Signing
  /v1/public/storefront/{tenant_id}/carts:
    post:
      description: |-
        The StoreKit route takes a `user_id`/`session_id` and hands back whichever
        active cart already matches. That lookup is why this one takes no body at
        all: `find_active_by_user_id` would let an anonymous caller name a signed-in
        shopper and be given their cart, and a caller-chosen session id is a guess
        away from the same thing. The session identifier is minted here instead, so
        the returned `crt_`+ULID cart id is the only handle to this cart and the
        caller is the only party that has ever seen it.
      operationId: public_storefront_create_cart
      parameters:
      - description: Tenant whose public storefront is being ordered from
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCartResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Tenant cart budget exhausted
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public storefront limiter unavailable
