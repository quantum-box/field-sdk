  /v1/storekit/customers:
    get:
      description: |-
        `email` matches exactly; `name` (display name or kana reading) and
        `phone` match partially. Results are candidates: customers are never
        merged or deduplicated, so two people sharing a name or a household
        phone number stay separate records. Picking the right candidate — or
        registering a new customer — is the caller's decision.

        `ids` fetches a known set of customers in one call, for callers that
        already hold customer IDs and only need the names and phone numbers to
        display alongside them. It is ANDed with the other filters, is capped at
        100 IDs per request (more is a 400, never a silent truncation), and
        drops IDs that do not exist instead of failing the request.

        `offset` pages through the filtered set, and `total` on the response is
        that set's size — not the size of the returned page. The order is stable
        for a given filter, so paging neither repeats nor skips a row.

        `limit` and `offset` on the response body are always `0` here: the
        legacy upstream list carried no pagination metadata and StoreKit has
        exposed zeroes since. Read `has_more` and `total` instead.
      operationId: list_customers
      parameters:
      - description: Exact email match.
        in: query
        name: email
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Partial match against the display name or its kana reading.
        in: query
        name: name
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Partial match against the phone number. Separators are ignored on
          both sides, so `090-1234-5678` and `09012345678` match.
        in: query
        name: phone
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Comma-separated customer IDs, at most 100 per request
          (`ids=cus_a,cus_b`). Combines with `email`, `name`
          and `phone` as AND, and does not widen `limit`: pass a `limit` big
          enough for the set you asked for. IDs that do not exist are dropped
          from the result rather than reported. More than 100 IDs is a 400;
          the list is never silently truncated. An `ids` that parses to no ID
          at all matches nothing, so an empty page stays empty.
        in: query
        name: ids
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: limit
        required: false
        schema:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      - description: Rows to skip, applied after the filters above. Defaults to 0.
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreKitList_CustomerResponse'
          description: ''
        '400':
          description: More than 100 `ids` in one request
      summary: List customers.
      tags:
      - StoreKit
    post:
      description: |-
        `email` is optional. Customers taken by phone or at the counter often
        have none, and they still need a ledger entry so their visit history
        can be aggregated.
      operationId: create_customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
      summary: Create customer.
      tags:
      - StoreKit
  /v1/storekit/customers/{customer_id}:
    delete:
      operationId: delete_customer
