components:
  schemas:
    AcceptOrderByQuotationResponse:
      properties:
        orderId:
          type: string
      required:
      - orderId
      type: object
    ActivityListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityResponse'
          type: array
      required:
      - items
      type: object
    ActivityResponse:
      properties:
        clientId:
          type: string
        content:
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type:
          - string
          - 'null'
        dealId:
          type:
          - string
          - 'null'
        id:
          type: string
        kind:
          type: string
        occurredAt:
          format: date-time
          type: string
        tenantId:
          type: string
      required:
      - id
      - tenantId
      - clientId
      - kind
      - content
      - occurredAt
      - createdAt
      type: object
    AddCartItemRequest:
      properties:
        note:
          description: Free-text note for this line, e.g. a kitchen instruction.
          type:
          - string
          - 'null'
        option_ids:
          items:
            type: string
          type:
          - array
          - 'null'
        product_id:
          type: string
        quantity:
          format: int32
          minimum: 0
          type: integer
        variant_id:
          type:
          - string
          - 'null'
      required:
      - product_id
      - quantity
      type: object
    AddOperatorRequest:
      properties:
        operator_id:
          description: Operator (tenant) ID to associate.
          type: string
      required:
      - operator_id
      type: object
    AgentDocumentCapabilities:
      properties:
        invoices:
          $ref: '#/components/schemas/AgentDocumentQueueCapabilities'
        quotations:
          $ref: '#/components/schemas/AgentDocumentQueueCapabilities'
      required:
      - invoices
      - quotations
      type: object
    AgentDocumentQueueCapabilities:
      properties:
        list:
          type: boolean
        send:
          type: boolean
      required:
      - list
      - send
      type: object
    ApiKeyResponse:
      properties:
        createdAt:
          type: string
        id:
          type: string
        keyPrefix:
          type: string
        lastUsedAt:
          type:
          - string
          - 'null'
        name:
          type: string
        revokedAt:
          type:
          - string
          - 'null'
        scopes:
          items:
            type: string
          type: array
        useCases:
          items:
            type: string
          type: array
      required:
      - id
      - name
      - keyPrefix
      - useCases
      - scopes
      - createdAt
      type: object
    ApprovalFlowListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApprovalFlowResponse'
          type: array
      required:
      - items
      type: object
    ApprovalFlowResponse:
      properties:
        active:
          type: boolean
        createdAt:
          type: string
        id:
          type: string
        minAmount:
          format: int64
          type:
          - integer
          - 'null'
        name:
          type: string
        resourceType:
          type: string
        steps:
          items:
            $ref: '#/components/schemas/ApprovalFlowStep'
          type: array
        tenantId:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - resourceType
      - name
      - steps
      - active
      - createdAt
      - updatedAt
      type: object
    ApprovalFlowSnapshot:
      description: Frozen copy of the definition captured when a workflow is requested.
      properties:
        definitionId:
          type: string
        name:
          type: string
        steps:
          items:
            $ref: '#/components/schemas/ApprovalFlowStep'
          type: array
      required:
      - definitionId
      - name
      - steps
      type: object
    ApprovalFlowStep:
      description: One stage in a multi-step approval flow definition.
      properties:
        approverRole:
          description: Role expected to approve this step (informational for now).
          type: string
        minApprovals:
          description: Number of approvals required to clear this step (>= 1).
          format: int32
          minimum: 0
          type: integer
        name:
          type: string
        stepOrder:
          description: 1-based, sequential order of the step.
          format: int32
          minimum: 0
          type: integer
      required:
      - stepOrder
      - name
      - approverRole
      - minApprovals
      type: object
    ApprovalMutationRequest:
      properties:
        action:
          type: string
        comment:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        resourceId:
          type:
          - string
          - 'null'
        resourceType:
          type:
          - string
          - 'null'
      required:
      - action
      type: object
    ApprovalWorkflowEventResponse:
      properties:
        action:
          type: string
        actorId:
          type: string
        comment:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        step:
          description: 1-based step the action was applied to. Absent for single-stage workflows.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - action
      - actorId
      - createdAt
      type: object
    ApprovalWorkflowListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApprovalWorkflowResponse'
          type: array
      required:
      - items
      type: object
    ApprovalWorkflowResponse:
      properties:
        cancelledAt:
          type:
          - string
          - 'null'
        cancelledBy:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        currentStep:
          description: 1-based current step for multi-stage workflows. `0` = single-stage.
          format: int32
          minimum: 0
          type: integer
        definitionSnapshot:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ApprovalFlowSnapshot'
            description: Approval flow definition frozen at request time. Absent for single-stage workflows.
        history:
          items:
            $ref: '#/components/schemas/ApprovalWorkflowEventResponse'
          type: array
        id:
          type: string
        requestedAt:
          type: string
        requestedBy:
          type: string
        resourceId:
          type: string
        resourceType:
          type: string
        reviewedAt:
          type:
          - string
          - 'null'
        reviewedBy:
          type:
          - string
          - 'null'
        status:
          type: string
        tenantId:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - resourceType
      - resourceId
      - status
      - requestedBy
      - requestedAt
      - currentStep
      - history
      - createdAt
      - updatedAt
      type: object
    ArtifactDownloadResponse:
      properties:
        contentType:
          type: string
        expiresAt:
          type: string
        fileSizeBytes:
          format: int64
          minimum: 0
          type: integer
        sha256:
          type: string
        url:
          type: string
      required:
      - url
      - expiresAt
      - contentType
      - fileSizeBytes
      - sha256
      type: object
    AssignMembershipPlanRequest:
      properties:
        note:
          type:
          - string
          - 'null'
        planId:
          description: |-
            Class to join directly. Mutually exclusive with `productId`; one of
            the two is required.
          type:
          - string
          - 'null'
        productId:
          description: Product being sold. Mutually exclusive with `planId`.
          type:
          - string
          - 'null'
        startedOn:
          description: YYYY-MM-DD (default today)
          type:
          - string
          - 'null'
      type: object
    AutoAssignCaddiesRequest:
      properties:
        date:
          description: 対象となるテナントローカル日付。
          format: date
          type: string
        dryRun:
          description: true なら計画のみ返し、割当は保存しない
          type: boolean
        timezone:
          description: '`date` と午前・午後を定義する IANA timezone。省略時は従来の Asia/Tokyo。'
          type:
          - string
          - 'null'
      required:
      - date
      type: object
    AutoAssignCaddiesResponse:
      properties:
        assigned:
          items:
            $ref: '#/components/schemas/AutoAssignPlanItem'
          type: array
        dryRun:
          type: boolean
        skipped:
          items:
            $ref: '#/components/schemas/AutoAssignSkippedItem'
          type: array
      required:
      - dryRun
      - assigned
      - skipped
      type: object
    AutoAssignPlanItem:
      properties:
        caddieDisplayName:
          type: string
        caddieProfileId:
          type: string
        rationale:
          description: 選定理由（月間目標の残数・稼働状況など）
          items:
            type: string
          type: array
        reservationId:
          type: string
        scheduledAt:
          format: date-time
          type: string
      required:
      - reservationId
      - scheduledAt
      - caddieProfileId
      - caddieDisplayName
      - rationale
      type: object
    AutoAssignSkippedItem:
      properties:
        reason:
          type: string
        reservationId:
          type: string
      required:
      - reservationId
      - reason
      type: object
    BillingAccountResponse:
      properties:
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        updated_at:
          type: string
      required:
      - id
      - name
      - created_at
      - updated_at
      type: object
    BridgeActionRequest:
      properties:
        definitionId:
          type:
          - string
          - 'null'
        runId:
          type:
          - string
          - 'null'
      type: object
    BridgeActionResponse:
      properties:
        action:
          type: string
        allowed:
          type: boolean
        reason:
          type: string
      required:
      - action
      - allowed
      - reason
      type: object
    BridgeDefinitionListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BridgeDefinitionResponse'
          type: array
      required:
      - items
      type: object
    BridgeDefinitionRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        mapping:
          $ref: '#/components/schemas/BridgeMapping'
        name:
          type: string
        sourceType:
          type: string
        status:
          type:
          - string
          - 'null'
        targetObject:
          type: string
      required:
      - name
      - sourceType
      - targetObject
      - mapping
      type: object
    BridgeDefinitionResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        mapping:
          $ref: '#/components/schemas/BridgeMapping'
        name:
          type: string
        schemaVersion:
          type: string
        sourceType:
          type: string
        status:
          type: string
        targetObject:
          type: string
        tenantId:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type:
          - string
          - 'null'
      required:
      - id
      - tenantId
      - name
      - sourceType
      - targetObject
      - schemaVersion
      - mapping
      - status
      - createdAt
      - updatedAt
      type: object
    BridgeExportDefinitionListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BridgeExportDefinitionResponse'
          type: array
      required:
      - items
      type: object
    BridgeExportDefinitionRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        destinationType:
          type: string
        mapping:
          $ref: '#/components/schemas/BridgeMapping'
        name:
          type: string
        sourceObject:
          type: string
        status:
          type:
          - string
          - 'null'
      required:
      - name
      - destinationType
      - sourceObject
      - mapping
      type: object
    BridgeExportDefinitionResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        destinationType:
          type: string
        id:
          type: string
        mapping:
          $ref: '#/components/schemas/BridgeMapping'
        name:
          type: string
        schemaVersion:
          type: string
        sourceObject:
          type: string
        status:
          type: string
        tenantId:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type:
          - string
          - 'null'
      required:
      - id
      - tenantId
      - name
      - destinationType
      - sourceObject
      - schemaVersion
      - mapping
      - status
      - createdAt
      - updatedAt
      type: object
    BridgeExportField:
      description: |-
        One exportable property of a source object: the key `serde_json::to_value`
        produces on the fetched row, plus an operator-facing label.
      properties:
        field:
          type: string
        label:
          type: string
      required:
      - field
      - label
      type: object
    BridgeExportObjectListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BridgeExportObjectResponse'
          type: array
      required:
      - items
      type: object
    BridgeExportObjectResponse:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/BridgeExportField'
          type: array
        key:
          type: string
        label:
          type: string
      required:
      - key
      - label
      - fields
      type: object
    BridgeMapping:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/BridgeMappingField'
          type: array
        llmProposal: {}
      required:
      - fields
      type: object
    BridgeMappingField:
      properties:
        approved:
          type: boolean
        confidence:
          format: double
          type:
          - number
          - 'null'
        explanation:
          type:
          - string
          - 'null'
        required:
          type: boolean
        source:
          type: string
        target:
          type: string
        transform:
          type:
          - string
          - 'null'
      required:
      - source
      - target
      type: object
    BridgeRunListResponse:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/BridgeRunSummaryResponse'
          type: array
        limit:
          format: int32
          minimum: 0
          type: integer
        offset:
          format: int64
          minimum: 0
          type: integer
      required:
      - items
      - limit
      - offset
      - hasMore
      type: object
    BridgeRunPreviewRequest:
      properties:
        idempotencyKey:
          type:
          - string
          - 'null'
        llmProposal: {}
        rawCsv:
          type: string
        sourceFileName:
          type:
          - string
          - 'null'
      required:
      - rawCsv
      type: object
    BridgeRunResponse:
      properties:
        actorId:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        createdCount:
          format: int64
          type: integer
        definitionId:
          type: string
        errorCount:
          format: int64
          type: integer
        executedAt:
          type:
          - string
          - 'null'
        id:
          type: string
        idempotencyKey:
          type: string
        llmProposal: {}
        normalized: {}
        rawSource: {}
        sourceFileHash:
          type: string
        sourceFileName:
          type:
          - string
          - 'null'
        status:
          type: string
        tenantId:
          type: string
      required:
      - id
      - tenantId
      - definitionId
      - idempotencyKey
      - sourceFileHash
      - status
      - rawSource
      - normalized
      - createdCount
      - errorCount
      - createdAt
      type: object
    BridgeRunSummaryResponse:
      properties:
        createdAt:
          type: string
        createdCount:
          format: int64
          type: integer
        definitionId:
          type: string
        errorCount:
          format: int64
          type: integer
        executedAt:
          type:
          - string
          - 'null'
        id:
          type: string
        sourceFileName:
          type:
          - string
          - 'null'
        status:
          type: string
        tenantId:
          type: string
      required:
      - id
      - tenantId
      - definitionId
      - status
      - createdCount
      - errorCount
      - createdAt
      type: object
    BridgeTargetFieldView:
      description: |-
        The wire shape of one target property, shared by the API and the UI so the
        browser never keeps its own copy of the field list.
      properties:
        aliases:
          items:
            type: string
          type: array
        allowed:
          description: Accepted spellings for `kind == "enum"`, otherwise empty.
          items:
            type: string
          type: array
        key:
          type: string
        kind:
          type: string
        label:
          type: string
        required:
          type: boolean
      required:
      - key
      - label
      - required
      - kind
      - allowed
      - aliases
      type: object
    BridgeTargetObjectListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BridgeTargetObjectView'
          type: array
      required:
      - items
      type: object
    BridgeTargetObjectView:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/BridgeTargetFieldView'
          type: array
        key:
          type: string
        label:
          type: string
        writable:
          description: Whether a previewed run of this target can be executed.
          type: boolean
      required:
      - key
      - label
      - writable
      - fields
      type: object
    CaddieAvailability:
      properties:
        caddieProfileId:
          type: string
        createdAt:
          format: date-time
          type: string
        date:
          format: date
          type: string
        extensionKey:
          type: string
        healthNote:
          type:
          - string
          - 'null'
        id:
          type: string
        status:
          $ref: '#/components/schemas/CaddieAvailabilityStatus'
        tenantId:
          type: string
        twoRoundRequest:
          type: boolean
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - tenantId
      - extensionKey
      - caddieProfileId
      - date
      - status
      - twoRoundRequest
      - createdAt
      - updatedAt
      type: object
    CaddieAvailabilityListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CaddieAvailability'
          type: array
      required:
      - items
      type: object
    CaddieAvailabilityStatus:
      description: キャディ日別勤務希望状態
      enum:
      - available
      - unavailable
      - morning_only
      - afternoon_only
      - light_duty
      type: string
    CaddieCourseMembership:
      description: キャディの対応可能コース（多対多）
      properties:
        caddieProfileId:
          type: string
        createdAt:
          format: date-time
          type: string
        extensionKey:
          type: string
        golfCourseId:
          type: string
        id:
          type: string
        isPrimary:
          type: boolean
        tenantId:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - tenantId
      - extensionKey
      - caddieProfileId
      - golfCourseId
      - isPrimary
      - createdAt
      - updatedAt
      type: object
    CaddieCourseMembershipListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CaddieCourseMembership'
          type: array
      required:
      - items
      type: object
    CancelExpiredResponse:
      description: Response for the cancel-expired-orders batch operation.
      properties:
        cancelled_count:
          description: Number of orders cancelled.
          format: int32
          minimum: 0
          type: integer
      required:
      - cancelled_count
      type: object
    CancelReservationRequest:
      description: |-
        `Serialize` is derived so the cancel handler can hash the request under an
        `Idempotency-Key`: the hash is what distinguishes a genuine retry from a key
        reused for a different cancellation.
      properties:
        cancellationFeeAmount:
          format: int64
          type:
          - integer
          - 'null'
        feeCancelUrl:
          type:
          - string
          - 'null'
        feeSuccessUrl:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        refundAmount:
          format: int64
          type:
          - integer
          - 'null'
      type: object
    CancellationActorType:
      description: |-
        What kind of principal performed a cancellation.

        `System` is not a fallback for "we failed to resolve the actor": it names
        cancellations that no human requested — an expired payment hold, a provider
        webhook — and those legitimately have no `actor_id`.
      enum:
      - user
      - service_account
      - system
      type: string
    CancellationFeeReportResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CancellationFeeReportRow'
          type: array
      required:
      - items
      type: object
    CancellationFeeReportRow:
      properties:
        cancellationFeeAmount:
          format: int64
          type: integer
        cancellationStatus:
          type: string
        cancelledAt:
          format: date-time
          type:
          - string
          - 'null'
        checkoutUrl:
          type:
          - string
          - 'null'
        createdAt:
          format: date-time
          type: string
        currency:
          type: string
        customerEmail:
          type:
          - string
          - 'null'
        customerName:
          type:
          - string
          - 'null'
        paidAmount:
          format: int64
          type: integer
        paymentStatus:
          $ref: '#/components/schemas/ReservationPaymentStatus'
        refundAmount:
          format: int64
          type: integer
        reservationId:
          type: string
        reservationNumber:
          type: string
        squarePaymentId:
          type:
          - string
          - 'null'
        squarePaymentLinkId:
          type:
          - string
          - 'null'
      required:
      - reservationId
      - reservationNumber
      - cancellationStatus
      - paymentStatus
      - cancellationFeeAmount
      - refundAmount
      - paidAmount
      - currency
      - createdAt
      type: object
    CartItemResponse:
      properties:
        base_unit_price_nanodollar:
          description: The product's own price, before the variant and option adjustments.
          format: int64
          type: integer
        id:
          type: string
        note:
          description: Free-text note for this line, e.g. a kitchen instruction.
          type:
          - string
          - 'null'
        options:
          items:
            $ref: '#/components/schemas/SelectedOptionResponse'
          type: array
        options_total_nanodollar:
          description: Per-unit sum of the chosen options.
          format: int64
          type: integer
        product_id:
          type: string
        quantity:
          format: int32
          minimum: 0
          type: integer
        reserved_until:
          type:
          - string
          - 'null'
        unit_price_nanodollar:
          description: 'Effective price per unit: base + variant + options.'
          format: int64
          type: integer
        variant_id:
          type:
          - string
          - 'null'
        variant_name:
          type:
          - string
          - 'null'
        variant_price_delta_nanodollar:
          format: int64
          type: integer
      required:
      - id
      - product_id
      - quantity
      - unit_price_nanodollar
      - base_unit_price_nanodollar
      - variant_price_delta_nanodollar
      - options
      - options_total_nanodollar
      type: object
    CartResponse:
      properties:
        created_at:
          type: string
        expires_at:
          type:
          - string
          - 'null'
        id:
          type: string
        items:
          items:
            $ref: '#/components/schemas/CartItemResponse'
          type: array
        session_id:
          type:
          - string
          - 'null'
        status:
          type: string
        tenant_id:
          type: string
        updated_at:
          type: string
        user_id:
          type:
          - string
          - 'null'
      required:
      - id
      - tenant_id
      - status
      - items
      - created_at
      - updated_at
      type: object
    CategoryResponse:
      properties:
        id:
          type: string
        image_url:
