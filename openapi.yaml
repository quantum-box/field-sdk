  /v1/erp/reservations/status-lookup:
    post:
      description: |-
        An extension that stores its own records against reservation ids (staff
        assignments, for example) has no way to learn that a reservation was
        cancelled elsewhere in Field. Re-listing reservations does not answer it
        either: `GET /v1/erp/reservations` is capped at 500 rows ordered by
        `startsAt DESC`, so anything older simply never comes back. This takes the
        ids the caller holds and answers only "are these still live", which stays
        correct however old the reservations are.

        It is a POST because the id set is a request body rather than a URL-sized
        parameter; it reads nothing else and is authorized as a read
        (`field:ListReservations`).
      operationId: lookup_reservation_statuses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationStatusLookupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationStatusLookupResponse'
          description: ''
      summary: Resolves the current state of reservations the caller already references.
      tags:
      - Reservations
