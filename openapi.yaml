        The variant and options are named by identifier only.

        This is what makes the selection safe to accept from an anonymous caller:
        the amount each choice adds is read from the catalog master server-side, so
        a request states *what* was chosen and never *what it costs*.
      properties:
        note:
          description: Free-text note for this line, e.g. a kitchen instruction.
          type:
          - string
          - 'null'
        option_ids:
          items:
            type: string
          type:
          - array
          - 'null'
        product_id:
          type: string
        quantity:
          format: int32
          minimum: 0
          type: integer
        variant_id:
          type:
          - string
          - 'null'
      required:
      - product_id
      - quantity
      type: object
    PublicCartItemResponse:
      properties:
        base_unit_price_nanodollar:
          description: The product's own price, before the variant and option adjustments.
          format: int64
          type: integer
        id:
          type: string
        note:
          description: Free-text note for this line, e.g. a kitchen instruction.
          type:
          - string
          - 'null'
        options:
          items:
            $ref: '#/components/schemas/PublicSelectedOptionResponse'
          type: array
        options_total_nanodollar:
          description: Per-unit sum of the chosen options.
          format: int64
          type: integer
        product_id:
          type: string
        quantity:
          format: int32
          minimum: 0
          type: integer
        subtotal_nanodollar:
          format: int64
          type: integer
        unit_price_nanodollar:
          description: |-
            Effective price per unit: base + variant + options, all resolved from
            the catalog. The request never states what a choice costs.
          format: int64
          type: integer
        variant_id:
          type:
          - string
          - 'null'
        variant_name:
