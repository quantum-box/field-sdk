  /v1/storekit/orders:
    get:
      operationId: storekit_list_orders
      parameters:
      - in: query
        name: user_id
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: session_id
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: customer_id
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Order status to keep. Accepts a comma-separated list
          (`confirmed,preparing,ready`) so a kitchen board can watch every
          in-progress status in one request.
        in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          RFC 3339 lower bound on `updated_at`, for delta polling.

          The bound is **inclusive**: `consumer_orders.updated_at` has
          second precision, so an exclusive bound would permanently drop a
          row updated later in the same second as the caller's cursor. Poll
          with the largest `updated_at` of the previous response and
          de-duplicate on order ID; the overlap is at most one second of
          rows.

          Supplying it also switches the result order to `updated_at`
          ascending, so a backlog longer than one page drains in order.
        in: query
        name: updated_after
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreKitList_OrderResponse'
          description: ''
      summary: List orders.
      tags:
      - StoreKit
