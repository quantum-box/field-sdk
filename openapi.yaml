          description: ''
        '400':
          description: 'status was supplied as anything other than Draft: purchase orders are created as drafts and advance through PATCH or POST /api/approvals'
        '409':
          description: Idempotency-Key reused with a different payload, or purchase_order_number already exists
      tags:
      - Purchase Orders
