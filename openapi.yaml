    ProductRestResponse:
      description: |-
        REST response for an order product.

        This mirrors the GraphQL `Product` type (`order_model::Product`) field for
        field, because the two surfaces describe the same row and clients read them
        interchangeably. It is a separate type because that file is
        GraphQL-schema-owned and cannot derive `utoipa::ToSchema`.

        REST additionally carries `categoryId` and `storefrontProductId` (#1136).
        Both belong to the storefront projection, which has no GraphQL surface
        (`/v1/graphql` is quarantined), so REST builds this straight from the
        `OrderProduct` row.
      properties:
        billingCycle:
          type: string
        category:
          type:
          - string
          - 'null'
        categoryId:
          description: Storefront category this product is filed under, when it has one.
          type:
          - string
          - 'null'
        createdAt:
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        imageFileIds:
          items:
            type: string
          type: array
        imageStorageKeys:
          items:
            type: string
          type: array
        janCode:
          type:
          - string
          - 'null'
        kind:
          type: string
        listPrice:
          format: int32
          type: integer
        name:
          type: string
        publicationDescription:
          type:
          - string
          - 'null'
        publicationName:
          type:
          - string
          - 'null'
        publicationStatus:
          type: string
        skuCode:
          type:
          - string
          - 'null'
        status:
          type: string
        storefrontProductId:
          description: |-
            Storefront catalog product this product is published as.

            `null` until the product is first created or updated with
            `publicationStatus: "PUBLIC"`. This is the id `/v1/storekit/products`
            lists it under and the id carts take, so consumers can link the two
            stores by id instead of matching on name (#1136).
          type:
          - string
          - 'null'
        subcategory:
          type:
          - string
          - 'null'
        tags:
          items:
            type: string
          type: array
        tenantId:
          type: string
        upcCode:
          type:
          - string
          - 'null'
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - name
      - status
      - kind
      - billingCycle
      - listPrice
      - tags
      - publicationStatus
      - imageFileIds
      - imageStorageKeys
      - createdAt
      - updatedAt
      type: object
