  /v1/erp/reservation-waitlist:
    get:
      description: |-
        Lists キャンセル待ち entries, oldest first.

        Each item carries `queuePosition` — its place among the entries still waiting for the same slot — and `availableSlotGroups`, the free inventory groups that slot has right now. One booking consumes one group whatever the party size, so a single free group seats an entry of any `quantity`. `availableSlotGroups` is absent when no slot has been opened for the requested time, which is a different situation from a full one. `seatableOnly=true` narrows the list to entries the slot can already take.
      operationId: list_reservation_waitlist
      parameters:
      - description: |-
          Defaults to `waiting`. Pass a terminal status to read the history of
          entries that already left the queue.
        in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: reservationTypeId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resourceId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: customerId
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Bounds `desiredStartsAt` as the half-open interval `[from, to)`.
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - in: query
        name: to
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - description: |-
          Keep only entries whose slot has room for them right now — the "空きが
          出た" list an operator works from.
        in: query
        name: seatableOnly
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationWaitlistListResponse'
          description: ''
      tags:
      - Reservations
    post:
      description: |-
        Adds one request to the queue.

        Joining the queue consumes no slot inventory: the whole point is that the slot has none left. The entry needs `customerId` or at least one of `customerName`, `customerEmail`, `customerPhone` — a waitlist nobody can call back is not actionable.
      operationId: create_reservation_waitlist_entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationWaitlistEntryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationWaitlistEntry'
          description: ''
      tags:
      - Reservations
  /v1/erp/reservation-waitlist/{id}:
    get:
      operationId: get_reservation_waitlist_entry
      parameters:
      - description: Waitlist entry ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationWaitlistEntry'
          description: ''
      tags:
      - Reservations
  /v1/erp/reservation-waitlist/{id}/close:
    post:
      description: |-
        Takes an entry out of the queue without booking it.

        Closing an entry that already left the queue returns it unchanged rather than rewriting why it first left.
      operationId: close_reservation_waitlist_entry
      parameters:
      - description: Waitlist entry ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseReservationWaitlistEntryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationWaitlistEntry'
          description: ''
      tags:
      - Reservations
  /v1/erp/reservation-waitlist/{id}/convert:
    post:
      description: |-
        Books the entry, seating the guest.

        This is the manual promotion. It runs the ordinary reservation creation path, so it takes the slot hold there and fails with 409 if the slot filled up again in the meantime — the entry then stays in the queue. The entry is stamped `converted` only after the reservation exists.
      operationId: convert_reservation_waitlist_entry
      parameters:
      - description: Waitlist entry ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertReservationWaitlistEntryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertReservationWaitlistEntryResponse'
          description: ''
      tags:
      - Reservations
  /v1/erp/reservations:
    get:
      description: |-
        Lists a tenant's reservations, newest start time first.

        `from`/`to` bound the reservation's own start time (`startsAt`) as the half-open interval `[from, to)`, so consecutive windows cover a period exactly once. `updatedSince` bounds `updatedAt` inclusively, for incremental reads.

        `limit` defaults to 100 and is capped at 500; a larger request is capped rather than rejected, and the response echoes the applied `limit`, `offset`, and the filter's `total`.
      operationId: list_reservations
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: paymentStatus
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: reservationTypeId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resourceId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: staffId
        required: false
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: customerId
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: Search reservation number or the reservation-held customer snapshot.
        in: query
        name: search
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: |-
          Inclusive lower bound on the reservation's own start time
          (`startsAt`), RFC 3339. Not the creation or update time.
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - description: |-
          Exclusive upper bound on the reservation's own start time
          (`startsAt`), RFC 3339. Exclusive so consecutive windows
          (`[from, to)`) cover a period exactly once.
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - description: |-
          Return only reservations whose `updatedAt` is at or after this RFC 3339
          instant. The bound is inclusive, so replaying the previous page's
          high-water mark can repeat a row but never skips one.
        in: query
        name: updatedSince
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - description: |-
          Page size. Defaults to 100, maximum 500. A larger value is capped at
          500 rather than rejected, and the applied value comes back as `limit`
          in the response. Declared in the description rather than as a schema
          `maximum` because the server caps instead of failing validation.
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListResponse'
          description: ''
      tags:
      - Reservations
    post:
      operationId: create_reservation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReservationResponse'
          description: ''
      tags:
      - Reservations
  /v1/erp/reservations/export.csv:
    get:
      operationId: export_reservations_csv
      parameters:
