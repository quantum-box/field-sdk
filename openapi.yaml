      tags:
      - Purchase Orders
    post:
      operationId: create_purchase_order
      parameters:
      - description: Optional tenant-scoped idempotency key. When omitted the request is a plain (non-idempotent) create. When supplied, a retry with the same key and identical payload returns the same purchase order; the same key with a different payload is rejected with 409.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
