components:
  schemas:
    ActivityListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityResponse'
          type: array
      required:
      - items
      type: object
    ActivityResponse:
      properties:
        clientId:
          type: string
        content:
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type:
          - string
          - 'null'
        dealId:
          type:
          - string
          - 'null'
        id:
          type: string
        kind:
          type: string
        occurredAt:
          format: date-time
          type: string
        tenantId:
          type: string
      required:
      - id
      - tenantId
      - clientId
      - kind
      - content
      - occurredAt
      - createdAt
      type: object
    AddCartItemRequest:
      properties:
        product_id:
          type: string
        quantity:
          format: int32
          minimum: 0
          type: integer
      required:
      - product_id
      - quantity
      type: object
    AddOperatorRequest:
      properties:
        operator_id:
          description: Operator (tenant) ID to associate.
          type: string
      required:
      - operator_id
      type: object
    AgentDocumentCapabilities:
      properties:
        invoices:
          $ref: '#/components/schemas/AgentDocumentQueueCapabilities'
        quotations:
          $ref: '#/components/schemas/AgentDocumentQueueCapabilities'
      required:
      - invoices
      - quotations
      type: object
    AgentDocumentQueueCapabilities:
      properties:
        list:
          type: boolean
        send:
          type: boolean
      required:
      - list
      - send
      type: object
    ApiKeyResponse:
      properties:
        createdAt:
          type: string
        id:
          type: string
        keyPrefix:
          type: string
        lastUsedAt:
          type:
          - string
          - 'null'
        name:
          type: string
        revokedAt:
          type:
          - string
          - 'null'
        scopes:
          items:
            type: string
          type: array
        useCases:
          items:
            type: string
          type: array
      required:
      - id
      - name
      - keyPrefix
      - useCases
      - scopes
      - createdAt
      type: object
    ApprovalFlowListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApprovalFlowResponse'
          type: array
      required:
      - items
      type: object
    ApprovalFlowResponse:
      properties:
        active:
          type: boolean
        createdAt:
          type: string
        id:
          type: string
        minAmount:
          format: int64
          type:
          - integer
          - 'null'
        name:
          type: string
        resourceType:
          type: string
        steps:
          items:
            $ref: '#/components/schemas/ApprovalFlowStep'
          type: array
        tenantId:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - resourceType
      - name
      - steps
      - active
      - createdAt
      - updatedAt
      type: object
    ApprovalFlowSnapshot:
      description: Frozen copy of the definition captured when a workflow is requested.
      properties:
        definitionId:
          type: string
        name:
          type: string
        steps:
          items:
            $ref: '#/components/schemas/ApprovalFlowStep'
          type: array
      required:
      - definitionId
      - name
      - steps
      type: object
    ApprovalFlowStep:
      description: One stage in a multi-step approval flow definition.
      properties:
        approverRole:
          description: Role expected to approve this step (informational for now).
          type: string
        minApprovals:
          description: Number of approvals required to clear this step (>= 1).
          format: int32
          minimum: 0
          type: integer
        name:
          type: string
        stepOrder:
          description: 1-based, sequential order of the step.
          format: int32
          minimum: 0
          type: integer
      required:
      - stepOrder
      - name
      - approverRole
      - minApprovals
      type: object
    ApprovalMutationRequest:
      properties:
        action:
          type: string
        comment:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        resourceId:
          type:
          - string
          - 'null'
        resourceType:
          type:
          - string
          - 'null'
      required:
      - action
      type: object
    ApprovalWorkflowEventResponse:
      properties:
        action:
          type: string
        actorId:
          type: string
        comment:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        step:
          description: 1-based step the action was applied to. Absent for single-stage workflows.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - action
      - actorId
      - createdAt
      type: object
    ApprovalWorkflowListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApprovalWorkflowResponse'
          type: array
      required:
      - items
      type: object
    ApprovalWorkflowResponse:
      properties:
        cancelledAt:
          type:
          - string
          - 'null'
        cancelledBy:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        currentStep:
          description: 1-based current step for multi-stage workflows. `0` = single-stage.
          format: int32
          minimum: 0
          type: integer
        definitionSnapshot:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ApprovalFlowSnapshot'
            description: Approval flow definition frozen at request time. Absent for single-stage workflows.
        history:
          items:
            $ref: '#/components/schemas/ApprovalWorkflowEventResponse'
          type: array
        id:
          type: string
        requestedAt:
          type: string
        requestedBy:
          type: string
        resourceId:
          type: string
        resourceType:
          type: string
        reviewedAt:
          type:
          - string
          - 'null'
        reviewedBy:
          type:
          - string
          - 'null'
        status:
          type: string
        tenantId:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - tenantId
      - resourceType
      - resourceId
      - status
      - requestedBy
      - requestedAt
      - currentStep
      - history
      - createdAt
      - updatedAt
      type: object
