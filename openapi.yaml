        a bearer before route classification existed, so this states the existing
        exposure rather than opening a new one. A shared tenant write budget now
        bounds its side effects. Because an attacker can spend that aggregate
        budget and lock out legitimate visitors, PLT-3683 still tracks the
        non-bypassable origin/client-level protection needed to prevent griefing.
      operationId: public_storefront_create_reservation
