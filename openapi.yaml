    ContactPreferenceResponse:
      description: |-
        チャネルごとに解決した現在の連絡可否。

        [`ContactPreferenceChannel::ALL`] の全チャネルを必ず返す。記録の無いチャネルを
        省くと、呼び出し側が「返ってこない = 不可」と読む余地が残る。
      properties:
        channel:
          $ref: '#/components/schemas/ContactPreferenceChannel'
        contactable:
          description: |-
            **いま**このチャネルへ連絡してよいか。申し出が一度も無ければ `true`
            （既定は連絡可）。
          type: boolean
        declared:
          description: |-
            顧客からの申し出が記録されているか。`false` は「聞いていない」で
            あって「拒否されていない」ことの証明ではない。
          type: boolean
        declaredAt:
          description: 最新の申し出の日時 (RFC 3339)。未記録なら `null`。
          type:
          - string
          - 'null'
        note:
          description: 申し出に添えられたメモ。
          type:
          - string
          - 'null'
        recordedBy:
          description: 受け付けた担当。
          type:
          - string
          - 'null'
        source:
          description: 申し出を受け取った経路 (`store` / `web` / `kiosk`)。連絡手段ではない。
          type:
          - string
          - 'null'
      required:
      - channel
      - contactable
      - declared
      type: object
