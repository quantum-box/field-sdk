      security:
      - {}
      summary: Read back the order this session placed.
      tags:
      - Public ordering
  /v1/public/order-sessions/current/orders:
    post:
      description: |-
        `Idempotency-Key` is required, not optional. A diner taps twice, a phone
        loses signal mid-request and the app retries, a kiosk reloads: all three
        arrive here as a second identical POST, and the key is what makes the second
        one return the first one's order instead of creating another.

        Failure is handled the same way and for the same reason. When the checkout
        call does not come back with an answer, the key is marked `failed` and the
        session is marked `unknown`, which refuses every later attempt on that
        session rather than risking a duplicate. Staff resolve it; the software
        does not guess.
      operationId: place_order
      parameters:
      - description: Required; replays return the first result
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacePublicOrderRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrderResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing Idempotency-Key or invalid line
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No live session
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Key reused with a different body, still processing, or previously failed
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Tenant order budget exhausted
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public ordering protection is unavailable
      security:
      - {}
      summary: Place the order this session has been assembling.
      tags:
      - Public ordering
  /v1/public/order-sessions/current/reset:
    post:
      description: |-
        Idempotent on purpose: a kiosk that clears itself after an abandoned order
        should not have to know whether it still holds a live session.
      operationId: reset_session
      responses:
        '204':
          description: Session ended
      security:
      - {}
      summary: End the session and make its token useless.
      tags:
      - Public ordering
